[project]
name = "trading-mvp"
version = "0.1.0"
description = "Quantitative Trading MVP - Fundamental-Technical Analysis System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "aiosignalr>=0.3",
    "sqlite-utils>=3.37",
    "axiom-axle>=1.9",
    "decimal-precision>=1.0",
    "structlog>=24.1",
    "prometheus-client>=0.19",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.98",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "black>=24.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "ARG", "SIM", "TID", "TRY", "PD", "RUF"]
ignore = ["S101", "T201"]  # Allow assert and print in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hypothesis]
database = ".hypothesis"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"